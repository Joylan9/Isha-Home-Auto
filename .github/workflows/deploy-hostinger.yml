name: Deploy to Hostinger

# Every push to the production branch builds the site and uploads it to
# Hostinger over FTP. Required repository secrets (Settings → Secrets and
# variables → Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Optional repository variable FTP_SERVER_DIR (defaults to public_html/).

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out production
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
